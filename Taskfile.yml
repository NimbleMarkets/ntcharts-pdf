version: '3'

tasks:
  default:
    desc: 'Default task runs the "build" task'
    deps:
      - build

  list:
    desc: 'Lists available tasks'
    cmds:
      - task --list-all

###############################################################################

  go-tidy:
    desc: 'Go tidy all the things'
    run: once
    cmds:
      - go mod tidy

  go-update:
    desc: 'Go update all the dependencies'
    run: once
    cmds:
      - go get -u ./...

  test:
    desc: 'Run all Go tests'
    cmds:
      - go test ./...

  build:
    desc: 'Build all the things'
    deps:
      - build-examples

  clean:
    desc: 'Clean built examples'
    cmds:
      - rm -f bin/ntcharts-pdfview
      - rm -rf .task

###############################################################################
# Examples

  build-examples:
    desc: 'Build all examples'
    deps:
      - build-ex-pdfview

  build-ex-pdfview:
    desc: 'Build the pdfview example'
    deps:
      - go-tidy
    cmds:
      - go build -o bin/ntcharts-pdfview ./examples/pdfview
    sources:
      - pdfview/**/*.go
      - examples/pdfview/*.go
      - examples/pdfview/testdata/Example.pdf
      - go.mod
    generates:
      - bin/ntcharts-pdfview

###############################################################################
# Demo gif (note: Kitty graphics do not render in VHS — this captures the
# half-block path only; do a hand-made recording for Kitty-mode demos).

  vhs-validate:
    desc: 'Validate vhs tape file'
    cmds:
      - vhs validate ./examples/pdfview/demo.tape

  vhs:
    desc: 'Generate gif via vhs'
    deps:
      - build-ex-pdfview
    cmds:
      - vhs --output ./examples/pdfview/demo.gif ./examples/pdfview/demo.tape

###############################################################################
# Demo website via booba

  build-wasm-site:
    desc: 'Build the WASM demo site into web/'
    # ensure-pdfium-bridge guarantees web/index.html's @embedpdf/pdfium
    # importmap target exists; otherwise the page boots and the JS
    # console errors immediately on module load.
    deps: [go-tidy, ensure-pdfium-bridge]
    cmds:
      - GOARCH=wasm GOOS=js go build -o web/app.wasm ./examples/pdfview/
      - go tool booba-assets web/
    generates:
      - web/app.wasm

  serve-wasm-site:
    desc: 'Serve web/ at http://localhost:8000/ntcharts-pdf/ (matches GH Pages prefix)'
    deps: [build-wasm-site]
    vars:
      SERVE_DIR: /tmp/ntcharts-pdf-site
    cmds:
      - mkdir -p {{.SERVE_DIR}}
      - rm -f {{.SERVE_DIR}}/ntcharts-pdf
      - ln -sfn "$(pwd)/web" {{.SERVE_DIR}}/ntcharts-pdf
      - echo 'Serving at http://localhost:8000/ntcharts-pdf/'
      - cd {{.SERVE_DIR}} && python3 -m http.server 8000

  clean-wasm-site:
    desc: 'Remove WASM demo site artifacts'
    cmds:
      - rm -rf web/booba web/ghostty-web
      - rm -f web/wasm_exec.js
      - rm -f web/app.wasm

  ensure-pdfium-bridge:
    desc: 'Run install-pdfium-bridge only when the vendored dist is missing'
    # `status` blocks the task body when every listed path exists,
    # so re-runs are zero-cost; CI / fresh clones run the install once.
    status:
      - test -f web/vendor/embedpdf-pdfium/dist/index.js
    cmds:
      - task: install-pdfium-bridge

  install-pdfium-bridge:
    desc: 'Vendor @embedpdf/pdfium under web/vendor/ for the WASM demo site'
    cmds:
      - mkdir -p web/vendor
      - cd web/vendor && npm install @embedpdf/pdfium
      - test -f web/vendor/node_modules/@embedpdf/pdfium/dist/index.js
        || (echo "@embedpdf/pdfium dist not found — check the package's export layout and update web/index.html importmap" && exit 1)
      - rm -rf web/vendor/embedpdf-pdfium
      - cp -R web/vendor/node_modules/@embedpdf/pdfium web/vendor/embedpdf-pdfium
