name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Actions are pinned to commit SHAs (resolved from the version tag at
# pin time). This blocks tag-retagging attacks where an attacker who
# compromises an action repository can backdoor a release without
# bumping the tag. The `# v<tag>` trailing comment is the human-readable
# version reference — Dependabot / Renovate use it to drive bumps
# (see .github/dependabot.yml).

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/vendor/package-lock.json
      - name: Vendor @embedpdf/pdfium for the browser bridge
        # web/pdfium-bridge.js imports @embedpdf/pdfium through the
        # importmap declared in web/index.html, which resolves the
        # specifier to ./vendor/embedpdf-pdfium/dist/index.js. Only
        # web/vendor/package.json + package-lock.json are tracked; the
        # installed tree is regenerated here (mirrors local
        # `task install-pdfium-bridge`). Version pinning lives in the
        # lockfile; Dependabot drives bumps.
        run: |
          (cd web/vendor && npm ci --no-fund --no-audit)
          rm -rf web/vendor/embedpdf-pdfium
          cp -R web/vendor/node_modules/@embedpdf/pdfium web/vendor/embedpdf-pdfium
          # Strip npm scratch so the Pages artifact only ships the
          # bridge code the host page actually imports. Saves ~7 MB
          # per deploy and avoids exposing the lockfile.
          rm -rf web/vendor/node_modules web/vendor/package.json web/vendor/package-lock.json
      - name: Build WASM binary
        run: GOARCH=wasm GOOS=js go build -o web/app.wasm ./examples/pdfview/
      - name: Set up web assets
        run: go tool booba-assets web/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        id: deployment
