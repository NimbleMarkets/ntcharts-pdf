name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Actions are pinned to commit SHAs (resolved from the version tag at
# pin time). This blocks tag-retagging attacks where an attacker who
# compromises an action repository can backdoor a release without
# bumping the tag. The `# v<tag>` trailing comment is the human-readable
# version reference — Dependabot / Renovate use it to drive bumps
# (see .github/dependabot.yml).

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build WASM binary
        run: GOARCH=wasm GOOS=js go build -o web/app.wasm ./examples/pdfview/
      - name: Set up web assets
        run: go tool booba-assets web/
      - name: Install booba-shim pdfium assets
        run: go tool booba-shim-assets web/ --shim=pdfium
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
